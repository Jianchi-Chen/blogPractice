name: NodeJS with Vite
permissions:
    contents: read

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Validate production API URL
              run: node -e "const url = new URL(process.env.VITE_API_BASE_URL || ''); if (url.protocol !== 'https:' || url.pathname !== '/' || url.search || url.hash) throw new Error('VITE_API_BASE_URL must be an HTTPS origin without a path')"

            - name: Install dependencies
              run: npm ci
              working-directory: frontend

            - name: Test
              run: npm run test
              working-directory: frontend

            - name: Build
              run: npm run build
              working-directory: frontend
