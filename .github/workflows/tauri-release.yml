name: Tauri Release

on:
    push:
        tags:
            - "v*" # v1.0.0 / v0.1.0-beta 等
    workflow_dispatch:
        inputs:
            version:
                description: "Release tag, for example v1.2.3"
                required: true
                type: string

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Validate release configuration
              shell: bash
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                      echo "RELEASE_TAG must be a semantic version prefixed with v" >&2
                      exit 1
                  fi
                  node -e "const url = new URL(process.env.VITE_API_BASE_URL || ''); if (url.protocol !== 'https:' || url.pathname !== '/' || url.search || url.hash) throw new Error('VITE_API_BASE_URL must be an HTTPS origin without a path')"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Test frontend
              working-directory: frontend
              run: npm run test

            - name: Setup Rust
              uses: actions-rust-lang/setup-rust-toolchain@v1

            - name: Install Tauri test dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

            - name: Test HTTP API contract
              run: cargo test --manifest-path backend/Cargo.toml

            - name: Test desktop boundary
              run: cargo test --manifest-path frontend/src-tauri/Cargo.toml

    build:
        needs: verify
        permissions:
            contents: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc
                    - platform: macos-latest
                      target: x86_64-apple-darwin
                    - platform: macos-latest
                      target: aarch64-apple-darwin
                    - platform: ubuntu-latest
                      target: x86_64-unknown-linux-gnu

        runs-on: ${{ matrix.platform }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install jq (JSON processor)
              shell: bash
              run: |
                  if [[ "${{ matrix.platform }}" == "ubuntu-latest" ]]; then
                      sudo apt-get install -y jq
                  elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
                      brew install jq
                  elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
                      choco install jq -y
                  fi

            - name: Setup Rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  target: ${{ matrix.target }}

            - name: Fix Ubuntu package sources
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends software-properties-common
                  sudo add-apt-repository universe
                  sudo apt-get update

            - name: Install dependencies (Ubuntu)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Update version in all config files
              shell: bash
              run: |
                  VERSION="$RELEASE_TAG"
                  VERSION="${VERSION#v}"  # 移除 v 前缀

                  echo "Updating to version: $VERSION"

                  # macOS/Linux 使用 sed -i ''，Windows Git Bash 使用 sed -i
                  if [[ "$OSTYPE" == "darwin"* ]]; then
                      # macOS
                      sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" frontend/src-tauri/tauri.conf.json
                      sed -i '' "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" frontend/src-tauri/Cargo.toml
                      sed -i '' "1,/\"version\": \"[^\"]*\"/ s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" frontend/package.json
                  else
                      # Linux/Windows
                      sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" frontend/src-tauri/tauri.conf.json
                      sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" frontend/src-tauri/Cargo.toml
                      sed -i "1,/\"version\": \"[^\"]*\"/ s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" frontend/package.json
                  fi

                  # 验证更新结果
                  echo "=== Updated versions ==="
                  echo "tauri.conf.json:"
                  grep '"version":' frontend/src-tauri/tauri.conf.json
                  echo "Cargo.toml:"
                  grep '^version =' frontend/src-tauri/Cargo.toml
                  echo "package.json:"
                  grep '"version":' frontend/package.json | head -1

            - name: Configure bundle targets
              shell: bash
              working-directory: frontend/src-tauri
              run: |
                  # 读取当前配置
                  CONFIG_FILE="tauri.conf.json"

                  # 根据平台设置不同的 bundle targets
                  if [[ "${{ matrix.platform }}" == "ubuntu-latest" ]]; then
                      # Linux: deb、rpm 和用于自动更新的 AppImage
                      echo "Configuring Linux bundle targets: deb, rpm, appimage"
                      # 使用 jq 或 sed 修改配置（这里用简单的方式，直接添加 targets）
                      cat > bundle_config.json << 'EOF'
                  {
                      "bundle": {
                          "targets": ["deb", "rpm", "appimage"]
                      }
                  }
                  EOF
                  elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
                      # Windows: 只保留 msi，移除 nsis (setup.exe)
                      echo "Configuring Windows bundle targets: msi only"
                      cat > bundle_config.json << 'EOF'
                  {
                      "bundle": {
                          "targets": ["msi"]
                      }
                  }
                  EOF
                  elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
                      # macOS: 保留 dmg 和 app
                      echo "Configuring macOS bundle targets: dmg, app"
                      cat > bundle_config.json << 'EOF'
                  {
                      "bundle": {
                          "targets": ["dmg", "app"]
                      }
                  }
                  EOF
                  fi

                  # 合并配置到 tauri.conf.json
                  if command -v jq &> /dev/null; then
                      jq -s '.[0] * .[1]' "$CONFIG_FILE" bundle_config.json > tmp.json && mv tmp.json "$CONFIG_FILE"
                      rm bundle_config.json
                      echo "=== Updated bundle targets ==="
                      jq '.bundle.targets' "$CONFIG_FILE"
                  else
                      echo "jq not found, skipping bundle target configuration"
                  fi

            - name: Build & Release Tauri App
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: frontend
                  tagName: ${{ env.RELEASE_TAG }}
                  releaseName: "Release ${{ env.RELEASE_TAG }}"
                  releaseBody: |
                      📝 Auto-generated release for ${{ matrix.platform }}

                      - Built with Tauri
                      - Frontend: Vue3 + Vite
                      - API: shared Axum HTTP service

                      **Downloads:**
                      - Windows: `.msi` installer
                      - macOS: `.dmg` installer and `.app` bundle
                      - Linux: `.deb`, `.rpm`, `.AppImage`

                      **自动更新支持**: 应用内检查更新功能已启用
                  prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
                  releaseDraft: true
                  includeRelease: true
                  includeDebug: false
                  # 关键：确保生成 updater artifacts 和 latest.json
                  includeUpdaterJson: true
                  updaterJsonKeepUniversal: true
                  updaterJsonPreferNsis: false

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Publish complete stable release
              if: ${{ !contains(env.RELEASE_TAG, '-') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"

            - name: Publish complete prerelease
              if: ${{ contains(env.RELEASE_TAG, '-') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"

            - name: Delete older releases
              uses: dev-drprasad/delete-older-releases@v0.3.2
              with:
                  keep_latest: 2
                  delete_tags: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
